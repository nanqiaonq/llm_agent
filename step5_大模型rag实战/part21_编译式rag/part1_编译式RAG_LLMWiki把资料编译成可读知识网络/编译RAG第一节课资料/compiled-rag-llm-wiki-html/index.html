<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编译式 RAG：LLM Wiki 原理</title>
  <!-- Google Fonts: Sora + Noto Sans SC (中文字重覆盖) -->
  <!-- ←§一.骨架基础设施 字体引入 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- GSAP 3.12.x CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link rel="stylesheet" href="css/main.css?v=6">
</head>
<body>

  <!-- 进度条 ←§一.1 -->
  <div id="progress-bar-wrap">
    <div id="progress-bar"></div>
  </div>

  <!-- 侧边菜单遮罩 -->
  <div id="menu-overlay" onclick="window.__closeMenu()"></div>

  <!-- 侧边菜单 -->
  <nav id="side-menu">
    <div class="menu-header">
      <span class="menu-title">课程目录</span>
      <button class="menu-close-btn" onclick="window.__closeMenu()" aria-label="关闭菜单">&times;</button>
    </div>
    <div id="menu-list"></div>
  </nav>

  <!-- 主内容区 -->
  <main id="slide-viewport"></main>

  <!-- 左右导航按钮 -->
  <button id="nav-prev" onclick="window.__prevSlide()" aria-label="上一页">&#8592;</button>
  <button id="nav-next" onclick="window.__nextSlide()" aria-label="下一页">&#8594;</button>

  <!-- 左侧竖直工具栏（五件套）←§一.5 -->
  <!-- ←§一.5 工具栏五件套：M目录/T钢笔/D画板/颜色选择器/F全屏 -->
  <div id="side-toolbar">
    <!-- M 目录 -->
    <button id="btn-menu" onclick="window.__toggleMenu()" title="菜单 (M)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
      <span class="btn-key">M</span>
      <span class="btn-label">目录</span>
    </button>

    <div class="toolbar-divider"></div>

    <!-- 页码指示器 -->
    <div id="page-indicator">
      <span id="page-current">1</span>
      <span class="page-sep">/</span>
      <span id="page-total">21</span>
    </div>

    <div class="toolbar-divider"></div>

    <!-- T 钢笔拖尾 -->
    <button id="btn-pen" onclick="window.__togglePenTrail()" title="画笔拖尾 (T)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
        <path d="M2 2l7.586 7.586"></path>
        <circle cx="11" cy="11" r="2"></circle>
      </svg>
      <span class="btn-key">T</span>
      <span class="btn-label">钢笔</span>
    </button>

    <!-- D 画板 -->
    <button id="btn-draw" onclick="window.__toggleDrawBoard()" title="画板 (D)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
        <path d="M9 9l6 6M15 9l-6 6"></path>
      </svg>
      <span class="btn-key">D</span>
      <span class="btn-label">画板</span>
    </button>

    <!-- 颜色选择器（无文字标签）←§一.3 4色共享 currentDrawColor -->
    <div id="color-picker-wrap">
      <button id="btn-color" onclick="window.__toggleColorPicker()" title="画笔颜色">
        <span id="color-dot-indicator"></span>
      </button>
      <div id="color-picker-popup">
        <button class="color-dot" data-color="#ef4444" style="background:#ef4444" onclick="window.__setDrawColor('#ef4444')" title="红色"></button>
        <button class="color-dot" data-color="#3B82F6" style="background:#3B82F6" onclick="window.__setDrawColor('#3B82F6')" title="蓝色"></button>
        <button class="color-dot" data-color="#ffffff" style="background:#ffffff" onclick="window.__setDrawColor('#ffffff')" title="白色"></button>
        <button class="color-dot" data-color="#1e293b" style="background:#1e293b" onclick="window.__setDrawColor('#1e293b')" title="黑色"></button>
      </div>
    </div>

    <div class="toolbar-divider"></div>

    <!-- F 全屏 -->
    <button id="btn-fullscreen" onclick="window.__toggleFullscreen()" title="全屏 (F)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
      </svg>
      <span class="btn-key">F</span>
      <span class="btn-label">全屏</span>
    </button>
  </div>

  <!-- 双 canvas 标配（禁止省略）←§一.8 -->
  <!-- 钢笔拖尾 canvas：z-index:9999，FADE_MS=1200 模式 ←§一.1 -->
  <canvas id="pen-trail-canvas"></canvas>
  <!-- 画板 canvas：z-index:9998，清后退语义 ←§一.2 -->
  <canvas id="draw-board-canvas"></canvas>

  <!-- 键盘提示条（画板模式时显示）←§一.2 -->
  <div id="keyboard-hint">画板模式：再按 D 或 Esc 清除并退出</div>

  <script src="js/interactive.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
